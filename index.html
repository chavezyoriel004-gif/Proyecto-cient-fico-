</template><script id="state" type="application/json">{"ov":{"eyebrow":"Feria Científica Juvenil 2026","title":"Una mirada interactiva a la microbiota de nuestra piel","sub":"¿Qué le pasa a las bacterias de nuestra piel cuando usamos jabón antibacterial en lugar de un jabón neutro? Explora las evidencias del proyecto.","authors":"Jorge Chávez · Arianys Espinosa. \nProfesora asesora: Yaviris Sánchez · Instituto Benigno Jiménez Garay","fullTitle":"Efecto del uso de jabón antibacterial sobre la carga y diversidad morfológica bacteriana cutánea en estudiantes de educación media del Instituto Benigno Jiménez Garay.","question":"¿Cuál es el efecto del uso continuo de jabón antibacterial en comparación con el jabón neutro sobre la carga bacteriana y diversidad morfológica de la microbiota cutánea en estudiantes de educación media, y de qué manera sus hábitos de higiene y percepciones sobre la asepsia influyen en la exposición a estos productos? ","resLead":"El jabón antibacterial produjo una mayor reducción de microorganismos cultivables y cambios en las características de las colonias. Además, existe un conocimiento limitado sobre la función de la microbiota cutánea.","resNote":"","foot":"Proyecto científico · Instituto Benigno Jiménez Garay · 2026 · Contacto: chavezyoriel@icloud.com","about":[["Qué es la microbiota","La piel alberga una gran diversidad de bacterias, hongos y virus. Parte de esa comunidad es residente y cumple una función protectora frente a otros microorganismos."],["Por qué lo estudiamos","El uso de productos antibacteriales se ha popularizado en las comunidades educativas. Queremos saber cómo afecta el equilibrio de la microbiota de la piel."],["Qué comparamos","Un jabón antibacterial frente a un jabón neutro: cuántas colonias bacterianas (UFC) aparecen y cómo se ven (morfotipos), antes y después del tratamiento."],["Conclusión ","La investigación demuestra que la acción biocida del jabón antibacterial altera significativamente la viabilidad de la microbiota cutánea. Este mecanismo supera la remoción física por arrastre mecánico que caracteriza al jabón neutro."]],"faq":[{"q":"¿Qué es la microbiota cutánea?","k":"microbiota cutanea piel bacterias hongos virus que es","a":"Es la comunidad de bacterias, hongos y virus que vive sobre nuestra piel. Varía entre personas y entre zonas del cuerpo, y parte de ella nos protege."},{"q":"¿Qué comparó el proyecto?","k":"comparo compara jabon antibacterial neutro grupos experimento dias estudiantes","a":"Se comparó el uso de jabón antibacterial con el de un jabón neutro durante seis días, con 50 estudiantes divididos en dos grupos."},{"q":"¿Qué es una UFC?","k":"ufc unidad formadora colonia colonias significa que es","a":"UFC significa unidad formadora de colonias. Cada colonia visible en la placa proviene de una o pocas bacterias vivas, así que contarlas permite estimar cuántas bacterias cultivables había en la muestra."},{"q":"¿Qué es el triclosán?","k":"triclosan biocida ingrediente activo antibacterial fda","a":"Es un ingrediente activo que se añade a algunos jabones antibacteriales. En 2016 la FDA emitió una alerta porque no se demostraba que ofreciera más beneficio que un jabón común."},{"q":"¿Para qué sirve la prueba de catalasa?","k":"catalasa prueba bioquimica positivo negativo","a":"Detecta si las bacterias producen la enzima catalasa (distingue entre Staphylococcus y Streptococcus). En este proyecto, el 86% de las muestras dio positivo."},{"q":"¿Qué mostró la encuesta?","k":"encuesta resultados habitos higiene percepcion conocimiento personas respondieron encuestados cuantos participaron","a":"De 53 estudiantes, el 96.2% reconoció o usó jabón antibacterial, el 90.6% cree que eliminar microorganismos siempre es beneficioso y el 92.5% no conocía el concepto de microbiota cutánea."},{"q":"¿Cuál es la conclusión del proyecto?","k":"conclusion concluye conclusiones conclusion concluye demuestra biocida","a":"La investigación demuestra que la acción biocida del jabón antibacterial altera significativamente la viabilidad de la microbiota cutánea. Este mecanismo supera la remoción física por arrastre mecánico que caracteriza al jabón neutro."},{"q":"¿Cuántas muestras se analizaron?","k":"cuantas muestras analizaron estudiantes tamano grupos","a":"Participaron 50 estudiantes voluntarios, repartidos en dos grupos: uno usó jabón neutro y el otro jabón antibacterial durante seis días."},{"q":"¿Qué grupo redujo más las bacterias?","k":"grupo redujo mas reduccion bacterias cual mayor antibacterial neutro","a":"El grupo con jabón antibacterial: redujo en promedio 64.57% las UFC, frente a 36.92% del jabón neutro."},{"q":"¿Cuánto duró el experimento?","k":"duro cuanto dias tiempo duracion tratamiento","a":"El tratamiento duró seis días."},{"q":"¿Qué es un jabón neutro?","k":"jabon neutro que es arrastre mecanico","a":"Es un jabón sin agentes biocidas añadidos. Limpia sobre todo por arrastre mecánico: el agua y la espuma remueven la suciedad y los microorganismos."},{"q":"¿Qué significa que las bacterias sean viables?","k":"viabilidad viable viables vivas significa","a":"Las bacterias viables están vivas y pueden multiplicarse y formar colonias. Por eso las UFC sirven para medir viabilidad."},{"q":"¿Hubo más variación en algún grupo?","k":"variacion variabilidad variable desviacion dispersion neutro antibacterial","a":"Sí. El grupo neutro respondió de forma más variable entre estudiantes: la desviación estándar de la tasa de reducción fue 49.17%, frente a 22.87% del antibacterial."},{"q":"¿Quiénes hicieron este proyecto?","k":"quienes hicieron autores integrantes realizo asesora profesora colegio instituto","a":"Lo realizaron Jorge Chávez y Arianys Espinosa (XI-EA), con la asesoría de la profesora Yaviris Sánchez, en el Instituto Benigno Jiménez Garay."},{"q":"¿Por qué es importante este proyecto?","k":"importante importancia por que sirve estudiar planteamiento problema","a":"Hoy los productos antibacteriales se usan mucho, sobre todo en comunidades educativas. El proyecto busca aclarar cómo pueden afectar el equilibrio de la microbiota de la piel y contribuir a la resistencia bacteriana."},{"q":"¿Cuál era el objetivo del proyecto?","k":"objetivo objetivos meta proposito","a":"Analizar el efecto del jabón antibacterial frente a uno neutro en la cantidad de UFC y en la diversidad de las colonias, y relacionarlo con los hábitos y percepciones de higiene de los estudiantes mediante una encuesta."},{"q":"¿Cuál fue la hipótesis?","k":"hipotesis suposicion esperaba predijo","a":"La hipótesis fue que el jabón antibacterial, usado durante seis días seguidos, produciría una reducción de UFC mayor que el jabón neutro. Según el informe, los resultados la respaldan dentro del alcance del experimento."},{"q":"¿Cómo se tomaron las muestras?","k":"muestras tomaron toma hisopo antebrazo procedimiento metodo sembraron incubaron agar","a":"Con un hisopo estéril en el antebrazo, antes y después de los seis días. Se sembró en agar nutritivo y las placas se incubaron a temperatura ambiente; las colonias se contaron a las 48 horas."},{"q":"¿Qué es el agar nutritivo?","k":"agar nutritivo medio cultivo placa petri","a":"Es un medio con nutrientes en forma de gel donde las bacterias crecen y forman colonias visibles. Se usó en placas de Petri."},{"q":"¿Qué materiales se usaron?","k":"materiales usaron utilizaron equipo petri guantes alcohol mechero microscopio","a":"50 placas de Petri, agar nutritivo, hisopos estériles, solución salina, guantes, mascarillas, alcohol al 70%, 25 barras de jabón neutro, 25 de jabón antibacterial, mechero, portaobjetos y microscopio."},{"q":"¿Qué reglas siguieron los participantes?","k":"reglas participantes voluntarios consentimiento restricciones condiciones anonimo","a":"Participaron voluntariamente con consentimiento informado y datos anónimos con código numérico. Durante los seis días no debían usar en el antebrazo antibióticos tópicos, perfumes, lociones con fragancia, geles antibacteriales ni alcohol."},{"q":"¿Qué es el holobionte?","k":"holobionte superorganismo piel microbiota","a":"Es la idea de que nuestras células de la piel y su microbiota funcionan juntas como un superorganismo."},{"q":"¿Qué es la microbiota residente?","k":"microbiota residente residentes viven adheridos folículos glándulas staphylococcus epidermidis","a":"Son los microorganismos capaces de vivir y multiplicarse adheridos a la piel. Colonizan, por ejemplo, folículos y glándulas sebáceas."},{"q":"¿Cómo nos protege la microbiota? (exclusión competitiva)","k":"exclusion competitiva proteger protege funcion protectora comensales","a":"Las bacterias comensales ocupan los receptores de la piel, consumen los nutrientes disponibles y secretan péptidos antimicrobianos, lo que dificulta que otros microorganismos se establezcan."},{"q":"¿Cómo actúa el triclosán?","k":"triclosan actua mecanismo bacteriostatico enzima acidos grasos","a":"A concentraciones mínimas es bacteriostático: frena una enzima (FabI) necesaria para fabricar ácidos grasos, que las bacterias requieren para mantener sus membranas."},{"q":"¿Qué diferencia hay entre un jabón neutro y uno antibacterial?","k":"diferencia neutro antibacterial tensioactivos biocidas ingredientes","a":"El neutro limpia sobre todo por tensioactivos, que arrastran suciedad y microorganismos. El antibacterial añade ingredientes activos (biocidas), como el triclosán, que actúan químicamente sobre los microorganismos."},{"q":"¿Qué son los morfotipos?","k":"morfotipos morfotipo colonias tipos forma color tamano diversidad morfologica m1 m2 m3","a":"Son tipos de colonia clasificados por su aspecto: tamaño, color, bordes y elevación. Se identificaron cinco: M1 (grandes, beige o crema), M2 (pequeñas, amarillas y brillantes), M3 (intermedias, blanquecinas y traslúcidas), M4 (hongo filamentoso blanquecino) y M5 (hongo filamentoso oscuro)."},{"q":"¿Por qué hay colonias amarillas en las placas?","k":"colonias amarillas amarillo pigmentacion color placas","a":"Corresponden al morfotipo M2: colonias pequeñas, amarillas, brillantes y convexas. Con el método usado no se identificó la especie."},{"q":"¿Aparecieron hongos en las placas?","k":"hongos hongo filamentoso moho oscuras negras fungico","a":"Sí, en algunas muestras se vieron estructuras compatibles con hongos filamentosos (M4 y M5), sobre todo en placas del grupo neutro. No se identificó su especie."},{"q":"¿Se identificaron las especies de bacterias?","k":"identificaron identificacion especies genetica gram bioquimicas cuales bacterias","a":"No. Solo se describió el aspecto de las colonias y se hizo la prueba de catalasa. No hubo pruebas genéticas ni identificación de especie."},{"q":"¿Las bacterias que sobrevivieron son resistentes?","k":"resistentes resistencia sobrevivieron persistencia m2 superviviente","a":"No se puede afirmar. Que un morfotipo (como el M2) persista no demuestra resistencia: no se hizo una prueba de susceptibilidad ni una identificación de especie."},{"q":"¿Por qué algunas muestras aumentaron sus UFC?","k":"aumentaron aumento negativo crecimiento mayor despues valores negativos neutro","a":"En el grupo neutro la respuesta fue distinta entre personas: algunas muestras redujeron y otras aumentaron (hasta −116.20%). El informe señala que no toda reducción puede atribuirse solo al jabón, porque también influyen el ambiente y la manipulación diaria."},{"q":"¿Cuál fue la mayor reducción registrada?","k":"mayor maxima reduccion registrada mejor caso individual b10","a":"La mayor reducción individual fue de 87.87%, en la muestra B10-A, del grupo antibacterial."},{"q":"¿Qué dijo el análisis estadístico (chi-cuadrado)?","k":"chi cuadrado estadistico estadistica significativa significativo p valor","a":"El chi-cuadrado no encontró una diferencia estadísticamente significativa entre las frecuencias analizadas (p mayor que 0.05). El informe recomienda interpretar los resultados como una asociación y no como una causalidad absoluta."},{"q":"¿Cuántas muestras dieron positivo en catalasa?","k":"catalasa positivas negativas cuantas muestras 43 7","a":"De las 50 muestras, 43 fueron positivas y 7 negativas: 86% positivas y 14% negativas."},{"q":"¿Los estudiantes creen que se lavan bien?","k":"lavan lavado tecnica aseo percepcion adecuada mecanismo comprenden","a":"El 94.3% consideró adecuada su técnica de lavado, aunque es una percepción personal, no una comprobación. Solo el 30.2% comprendía el mecanismo de acción del jabón antibacterial."},{"q":"¿Cuáles fueron las limitaciones del estudio?","k":"limitaciones limitacion problemas dificultades presupuesto tiempo","a":"El tiempo no permitió ver si la microbiota se recupera, el presupuesto fue escaso, solo se evaluó el aspecto visual de las colonias (sin pruebas genéticas) y el laboratorio escolar no permitía pruebas especializadas. Además, la muestra fue pequeña y de una sola institución."},{"q":"¿La microbiota se recupera después del jabón antibacterial?","k":"recupera recuperacion regenera vuelve normal despues","a":"No se evaluó. El tiempo del estudio no permitió medir la recuperación de la microbiota."},{"q":"¿Qué recomiendan para futuras investigaciones?","k":"recomendaciones recomiendan futuro futuras investigaciones mejorar siguiente paso","a":"Medir el pH de los jabones, hacer ensayos más largos para ver la recuperación de la flora, usar pruebas bioquímicas, tinción de Gram o análisis moleculares, y estandarizar actividades diarias, tipo de piel y dieta."},{"q":"¿Debo dejar de usar jabón antibacterial?","k":"dejar usar deberia recomendacion consejo antibacterial salud medico","a":"El proyecto no da recomendaciones médicas. Muestra que eliminar más microorganismos no siempre significa más salud, y recuerda que en 2016 la FDA alertó que estos jabones no demostraban un beneficio mayor que el jabón común."},{"q":"¿Cómo puedo contactar a los autores?","k":"contactar contacto correo email escribir mensaje autores comunicarme preguntar mas informacion","a":"Puedes escribir a chavezyoriel@icloud.com."},{"q":"¿Dónde puedo hacer una pregunta que no esté aquí?","k":"pregunta no esta aqui otra duda consulta contacto correo email","a":"Escríbenos a chavezyoriel@icloud.com y te responderemos."},{"q":"¿Cuál fue la pregunta de investigación?","k":"pregunta investigacion problema planteamiento que se busca","a":"¿Cuál es el efecto del uso continuo de un jabón antibacterial, en comparación con un jabón neutro, sobre la carga bacteriana y la diversidad morfológica de la microbiota cutánea en estudiantes de educación media?"},{"q":"¿Dónde se hizo el experimento?","k":"donde lugar realizo laboratorio escuela colegio sitio","a":"En el laboratorio del centro educativo, el Instituto Benigno Jiménez Garay, siguiendo los mismos protocolos para todos los participantes."},{"q":"¿Qué tipo de estudio es?","k":"tipo estudio diseno enfoque experimental descriptivo cualitativo cuantitativo","a":"Es un estudio experimental y socio-descriptivo, con enfoque cuantitativo y cualitativo. La parte experimental analizó la flora de la piel antes y después de usar cada jabón, y la parte socio-descriptiva usó una encuesta cerrada sobre hábitos de limpieza y conocimiento."},{"q":"¿Qué microorganismos viven en la piel?","k":"microorganismos viven piel bacterias hongos virus variar zonas cuerpo personas","a":"La piel alberga una gran diversidad de bacterias, hongos y virus. Varían entre personas y entre zonas del cuerpo, y los factores que explican esa variabilidad aún no se entienden por completo."},{"q":"¿Qué bacterias viven normalmente en la piel?","k":"bacterias normales piel ejemplos staphylococcus epidermidis cutibacterium acnes corynebacterium nombres","a":"Entre las residentes se mencionan Staphylococcus epidermidis, Cutibacterium acnes y Corynebacterium. Este proyecto no identificó especies: solo describió el aspecto de las colonias."},{"q":"¿Qué es la microbiota transitoria?","k":"microbiota transitoria transitorios pasajeros depositan contacto superficies staphylococcus aureus enterobacterias","a":"Son microorganismos que solo se depositan en la piel por contacto con el entorno o con superficies contaminadas. No logran adherirse, como Staphylococcus aureus y las enterobacterias, y se eliminan con la limpieza habitual."},{"q":"¿Qué son los tensioactivos?","k":"tensioactivos tensioactivo surfactantes detergente anfifilico agua grasa tension superficial","a":"Son las moléculas principales de los jabones. Tienen un extremo que se une al agua y otro que se une a la grasa, lo que reduce la tensión superficial y permite retirar grasa y suciedad. Es la base de su acción detergente."},{"q":"¿Qué es un jabón antibacterial?","k":"jabon antibacterial antibacteriano antimicrobiano antiseptico ingredientes activos que es","a":"Es un jabón que lleva ingredientes activos que un jabón común no tiene. Se añaden para reducir o prevenir infecciones bacterianas."},{"q":"¿Qué diferencia hay entre bacteriostático y biocida?","k":"bacteriostatico biocida diferencia frena mata destruye concentracion triclosan","a":"Un agente bacteriostático frena el crecimiento de las bacterias; un biocida las destruye. El triclosán actúa como bacteriostático a concentraciones mínimas y como biocida a concentraciones altas, cuando rompe las membranas de las células bacterianas."},{"q":"¿Qué advirtió la FDA en 2016?","k":"fda 2016 alerta advertencia triclosan hormonales resistencia estados unidos","a":"La FDA alertó que el triclosán y otros agentes de los jabones antibacteriales no demostraban mayor beneficio que un jabón común y que podrían implicar riesgos como resistencia bacteriana o efectos hormonales."},{"q":"¿Qué hizo Panamá sobre estos productos?","k":"panama ministerio salud exhorto comercios eliminar productos noviembre 2016","a":"El 23 de noviembre de 2016, el Ministerio de Salud de Panamá exhortó a los comercios a ir eliminando productos con estos componentes, siguiendo las señales de la FDA."},{"q":"¿Qué estudios previos existen?","k":"estudios previos antecedentes larson kim moon investigaciones anteriores literatura nueva york hogares estudio previo hubo","a":"Larson y colaboradores (2004) hicieron un ensayo de cerca de un año en 238 hogares de Nueva York y no encontraron una diferencia importante en síntomas infecciosos entre jabones antibacteriales y comunes. Kim y Moon (2015) estudiaron el triclosán in vitro."},{"q":"¿Cuánto debe durar el lavado para que el antibacterial funcione mejor?","k":"cuanto lavado duracion tiempo exposicion nueve minutos segundos manos kim moon","a":"Según Kim y Moon (2015), el jabón antibacterial solo superó al neutro con más de nueve minutos de exposición. Un lavado normal dura unos 20 a 30 segundos, por lo que en la práctica actúa de forma mecánica, igual que el neutro."},{"q":"¿Por qué se popularizaron los jabones antibacteriales?","k":"popularizaron publicidad anuncios esterilidad limpieza mito moda por que usan","a":"Por anuncios que presentan la esterilidad total como único criterio de limpieza. Muchas personas los usan sin diferenciar entre el arrastre físico y la ruptura química, ni saber su efecto sobre la capa protectora de la piel."},{"q":"¿Qué es la resistencia bacteriana?","k":"resistencia bacteriana resistir antibioticos riesgo adaptacion","a":"Es cuando las bacterias dejan de ser afectadas por los productos que antes las controlaban. Organismos como la FDA advirtieron que el uso cotidiano de antibacteriales podría favorecerla. Este estudio no la midió."},{"q":"¿Cómo se analiza la microbiota en un laboratorio escolar?","k":"analiza analisis laboratorio escolar cuantificacion macroscopico secuenciacion genetica riqueza especies","a":"Se cuentan las colonias y se observa su aspecto. Una piel sana se asocia con una alta riqueza de especies y abundancia equilibrada. Como en el laboratorio escolar no se puede secuenciar el ADN, la caracterización se hace a simple vista, en agar nutritivo."},{"q":"¿Qué rasgos se observan en una colonia?","k":"rasgos colonia forma elevacion bordes color circular irregular plana convexa observan","a":"Se observa la forma (circular o irregular), la elevación (plana o convexa), los bordes (enteros u ondulados) y si produce color. Una pérdida masiva de estos rasgos indicaría pérdida de biodiversidad."},{"q":"¿Quiénes podían participar en el experimento?","k":"participar participantes criterios inclusion requisitos voluntarios sanos aptos quienes","a":"Estudiantes voluntarios de educación media, sanos y sin lesiones activas. No eran aptos quienes tenían infecciones visibles en la piel, tomaban antibióticos o usaban productos tópicos."},{"q":"¿Cómo se repartieron los jabones?","k":"repartieron entregaron jabones asignado marca grupos B N como","a":"Cada estudiante recibió el jabón asignado, sin decir la marca para no influir entre grupos, con la orden de usarlo de forma exclusiva durante seis días consecutivos y volver el día seis. El grupo B usó el antibacterial (muestras B1-A, B2-A…) y el grupo N el neutro (A1-N, A2-N…)."},{"q":"¿Cómo se preparó el medio de cultivo?","k":"preparo preparacion medio cultivo agar vertio placas ml mechero esteril 16 grados","a":"Se calentó agar nutritivo comercial hasta que quedó líquido y se vertieron unos 15.79 ml en cada placa de Petri, junto al mechero para trabajar en campo estéril. Se dejó solidificar y las placas se guardaron a 16 °C hasta usarlas."},{"q":"¿Qué es una placa de Petri?","k":"placa petri plato recipiente tapa que es","a":"Es un recipiente plano, transparente y con tapa donde se coloca el agar para cultivar microorganismos."},{"q":"¿Cómo se tomó la muestra con el hisopo?","k":"tomo muestra hisopo hisopado rotacion area 5 cm antebrazo solucion salina estriado siembra","a":"Con un hisopo estéril humedecido en solución salina al 0.9%, girándolo de forma continua sobre un área de 5 cm² del antebrazo. Después se sembró enseguida por estriado en la placa."},{"q":"¿Qué es el estriado?","k":"estriado siembra estria lineas separar colonias","a":"Es deslizar el hisopo sobre el agar haciendo líneas, para repartir los microorganismos y que formen colonias separadas que se puedan contar."},{"q":"¿Cuánto tiempo se incubaron las placas?","k":"incubaron incubacion tiempo horas temperatura ambiente 24 48","a":"A temperatura ambiente. La primera observación fue a las 24 horas y el conteo final a las 48 horas, tanto antes como después de los seis días de jabón."},{"q":"¿Cómo se contaron las colonias?","k":"contaron conteo contar colonias ufc cm2 densidad lectura final","a":"Con un conteo directo de UFC a las 48 horas, registrando además los morfotipos. La densidad se expresó en UFC por cm²."},{"q":"¿Qué datos se anotaron?","k":"datos anotaron bitacora registro registraron tablas observaciones","a":"En una bitácora se anotó para cada participante el grupo, el momento del muestreo, las UFC, las características de las colonias, los morfotipos y las observaciones a 24 y 48 horas. De la encuesta se registraron las rutinas de higiene y el conocimiento sobre la microbiota."},{"q":"¿Qué variables se controlaron?","k":"variables controladas independiente dependiente controlaron controlar","a":"La zona de muestreo (antebrazo), la duración del tratamiento, el protocolo de hisopado y siembra, la incubación y los criterios de inclusión. La variable independiente fue el tipo de jabón y las dependientes fueron el conteo de UFC y la diversidad de morfotipos."},{"q":"¿Cuál fue la hipótesis nula?","k":"hipotesis nula diferencia estadistica similitud","a":"Que no habría diferencias en la variación de UFC ni en la diversidad de morfotipos entre los voluntarios expuestos a los dos jabones."},{"q":"¿Qué fórmulas se usaron?","k":"formulas ecuaciones calculos porcentaje reduccion variacion absoluta media desviacion estandar matematicas","a":"El porcentaje de reducción, (UFC antes − UFC después) ÷ UFC antes × 100; la variación absoluta de UFC; la media y la desviación estándar de cada grupo; y la proporción porcentual de las respuestas de la encuesta."},{"q":"¿Qué significa un porcentaje de reducción negativo?","k":"porcentaje negativo reduccion negativa menos aumento significa signo","a":"Que después del tratamiento hubo más colonias que antes. Un valor negativo indica un aumento de la carga bacteriana."},{"q":"¿Con cuántas UFC empezaron los grupos?","k":"ufc iniciales inicio antes medias rango minimo maximo empezaron punto partida","a":"Al inicio, el grupo neutro tenía entre 114 y 2405 UFC y el antibacterial entre 208 y 1905. Las medias iniciales fueron 926.04 (neutro) y 1021.96 (antibacterial); después bajaron a 417.67 y 287.12."},{"q":"¿Qué pasó con la variabilidad entre muestras?","k":"desviacion estandar variabilidad dispersion coeficiente variacion consistente homogeneo","a":"En el grupo antibacterial la desviación estándar de las UFC bajó de 505.41 a 165.55, es decir, los valores quedaron más parecidos entre sí. El grupo neutro conservó una variabilidad alta, con un coeficiente de variación de 133.18%."},{"q":"¿Qué muestras tuvieron las mayores reducciones?","k":"mayores reducciones mejores muestras b10 b8 b19 b6 b2 a14 mas alta","a":"En el grupo antibacterial: B10-A (87.87%), B8-A (85.70%), B19-A (85.31%), B6-A (82.58%) y B2-A (82.42%). En el neutro, A14-N pasó de 2405 a 268 UFC (88.86%)."},{"q":"¿Cuál fue la muestra con mayor aumento?","k":"mayor aumento a19 crecio subio incremento 934 432","a":"A19-N, del grupo neutro, pasó de 432 a 934 UFC, una variación de −116.20%."},{"q":"¿Cuál fue la reducción más baja del grupo antibacterial?","k":"reduccion baja minima b23 menor","a":"B23-A, con 8.34%. Aun así, todos los valores del grupo antibacterial fueron de disminución."},{"q":"¿Por qué el grupo antibacterial fue más consistente?","k":"consistente uniforme por que antibacterial reduccion mecanismo accion antimicrobiana","a":"El jabón neutro actúa sobre todo con tensioactivos y arrastre físico. El antibacterial, además del lavado, tiene componentes antimicrobianos, lo que puede explicar su reducción más uniforme."},{"q":"¿Qué cambió en los morfotipos con el jabón antibacterial?","k":"morfotipos cambios antibacterial predominancia desaparecieron b17 b10 despues tratamiento","a":"En algunas muestras disminuyó el número de morfotipos y en otras cambió el predominante. Por ejemplo, en B17-A el M2 quedó muy escaso y permaneció el M1; en B10-A el M2 pasó a predominar."},{"q":"¿Qué pasó con el M2?","k":"m2 morfotipo amarillo persistio predomino b10 b25 antibacterial","a":"Apareció con frecuencia en el grupo antibacterial y en varios casos permaneció o siguió predominando después del tratamiento, como en B10-A y B25-A. Eso no demuestra que sea resistente."},{"q":"¿También cambiaron los morfotipos con el jabón neutro?","k":"morfotipos neutro cambios a2 a6 a12 tambien cambiaron","a":"Sí. En varias muestras se mantuvieron combinaciones de M1, M2 y M3 cambiando cuál predominaba; por ejemplo, A12-N pasó de tres morfotipos a solo M2. Por eso los cambios morfológicos no se atribuyen únicamente al jabón antibacterial."},{"q":"¿Cómo se comportaron M1, M2 y M3 en general?","k":"m1 m3 comportamiento morfotipos dinamica predominante variable","a":"El M1 mantuvo una presencia importante y en varias muestras pasó a predominar después del tratamiento. El M2 fue frecuente y a veces conservó su predominio. El M3 fue variable: a veces permaneció y otras fue reemplazado o acompañado por M1 o M2."},{"q":"¿Qué indica la prueba de catalasa?","k":"catalasa indica resultado especie bioquimica complementaria identifica","a":"Añade una característica bioquímica a las colonias, pero por sí sola no permite saber la especie. En este trabajo fue una prueba complementaria."},{"q":"¿Se puede saber qué piel está más limpia contando colonias?","k":"piel mas limpia contar colonias limpieza cantidad conteo esteril","a":"No solo así. El experimento muestra que no cambia únicamente la cantidad: también cambian los tipos de colonias y cuál predomina. Una piel «más limpia» no se evalúa solo contando colonias."},{"q":"¿Cuál jabón es mejor?","k":"cual jabon mejor recomendable superior neutro antibacterial comparacion","a":"El estudio no mide qué jabón es «mejor» para la salud. Midió que el antibacterial produjo una mayor reducción promedio de UFC, pero reducir más no es necesariamente más saludable, y la literatura citada indica que no se ha demostrado un beneficio adicional frente al jabón común."},{"q":"¿Qué dice la encuesta sobre percepción y realidad?","k":"percepcion realidad encuesta discrepancia creencias estudiantes mito esterilidad","a":"Muchos estudiantes creen lavarse correctamente (94.3%), usan jabón antibacterial y piensan que eliminar todos los microorganismos es beneficioso (90.6%), pero la mayoría desconoce la microbiota (92.5%). Usar o conocer un producto no significa entender cómo actúa."},{"q":"¿Cuántos estudiantes respondieron cada cosa en la encuesta?","k":"encuesta cuantos estudiantes numero 53 51 48 49 50 respondieron cifras","a":"De 53 estudiantes: 51 (96.2%) reconocieron o usaban jabón antibacterial, 48 (90.6%) creían que eliminar microorganismos siempre es beneficioso, 49 (92.5%) desconocían la microbiota cutánea y 50 (94.3%) consideraban adecuada su técnica de lavado."},{"q":"¿Qué necesidad educativa detectó el proyecto?","k":"necesidad educativa educacion conocimiento mecanismo accion 30.2 aprender ensenar","a":"Solo el 30.2% comprendía el mecanismo de acción del jabón antibacterial. Eso muestra que hay espacio para mejorar el conocimiento científico de los estudiantes sobre la microbiota cutánea."},{"q":"¿Cuál es el hallazgo más relevante del estudio?","k":"hallazgo relevante importante principal descubrimiento mas importante","a":"Que la mayor reducción de UFC del jabón antibacterial vino acompañada de cambios en la estructura de las colonias. Por eso estudiar la microbiota requiere observar tanto su cantidad como su composición."},{"q":"¿Qué no se puede afirmar con estos resultados?","k":"no se puede afirmar limites alcance patogenos selectivamente superar demostrar","a":"Que el jabón antibacterial elimine selectivamente microorganismos patógenos ni que los que sobreviven sean resistentes. El análisis es principalmente descriptivo."},{"q":"¿Los resultados prueban causa y efecto?","k":"causalidad causa efecto asociacion prueban correlacion demuestran","a":"El informe habla de una asociación: el grupo antibacterial tuvo una mayor reducción promedio de UFC, pero no debe confundirse asociación con causalidad absoluta."},{"q":"¿Qué factores pudieron influir en los resultados?","k":"factores influir sesgos variables individuales piel ambiente manipulacion diferencias","a":"Las diferencias individuales de la piel, la exposición diaria, el ambiente y la manipulación. También que el agar nutritivo no recupera todos los microorganismos. Por eso no toda reducción del grupo neutro se atribuye solo al jabón."},{"q":"¿Qué se haría con más tiempo y recursos?","k":"futuro mejorar ampliar mas participantes seguimiento identificacion metodos con mas recursos","a":"Ampliar el número de participantes, aumentar el tiempo de seguimiento y usar métodos de identificación más precisos, como tinción de Gram o análisis moleculares."},{"q":"¿Qué es UFC/cm²?","k":"ufc cm2 centimetro cuadrado densidad unidad medida area","a":"Es la cantidad de colonias por centímetro cuadrado de piel muestreada. Se usó para expresar la densidad final de microorganismos cultivables."},{"q":"¿Qué mostró el proyecto sobre la idea de que la piel debe estar estéril?","k":"esteril esterilidad piel idea erronea sesgo mito creencia asepsia","a":"La encuesta mostró una idea errónea frecuente: que eliminar todas las bacterias de la piel es saludable. Pero la microbiota residente cumple una función protectora, por lo que una piel estéril no es el objetivo."},{"q":"¿Cuál es el correo de contacto?","k":"correo email mail contacto escribir direccion","a":"El correo es chavezyoriel@icloud.com."},{"q":"¿El jabón antibacterial es dañino?","k":"danino danina perjudicial malo peligroso hace dano nocivo toxico antibacterial","a":"El proyecto no midió daños a la salud. Solo contó colonias de bacterias cultivables y observó su aspecto, y encontró que el jabón antibacterial redujo más las UFC. Eso no permite concluir que sea dañino ni que sea seguro."},{"q":"¿Es peligroso usar jabón antibacterial?","k":"peligroso peligro riesgo seguro seguridad usar antibacterial","a":"Este proyecto no evaluó riesgos para la salud. En su marco teórico, el informe menciona que la FDA alertó en 2016 sobre posibles riesgos del triclosán, como resistencia bacteriana o efectos hormonales, y que no se demostraba un beneficio mayor que el jabón común. Para decidir qué usar, consulta a un profesional de la salud."},{"q":"¿Qué jabón debo usar?","k":"que jabon usar comprar recomiendas recomendado elegir debo mejor cual comprar","a":"El proyecto no recomienda marcas ni da consejos de salud. Solo comparó dos tipos de jabón en una situación concreta. Para decidir qué usar, consulta a un profesional de la salud."},{"q":"¿El jabón antibacterial sirve contra virus o el COVID-19?","k":"virus covid coronavirus gripe sirve contra virus","a":"El proyecto no estudió virus ni COVID-19. Solo contó colonias de bacterias que crecen en agar nutritivo. Para ese tema, consulta fuentes de salud confiables."},{"q":"¿Los resultados son concluyentes?","k":"concluyentes concluyente definitivos certeza confiable fiable pruebas definitivas","a":"No de forma definitiva. Es un estudio pequeño, de seis días, en una sola institución, que describe las colonias a simple vista, y el chi-cuadrado no mostró una diferencia estadísticamente significativa. Los resultados son una primera aproximación y deben interpretarse con prudencia."},{"q":"¿Se pueden generalizar los resultados a otras personas?","k":"generalizar generalizacion otras personas poblacion todos aplicar extrapolar","a":"No con seguridad. La muestra fue de 50 estudiantes de una misma institución, durante seis días, y la piel varía entre personas. Los resultados describen este grupo y no deben aplicarse a todas las personas."},{"q":"¿Qué grado de certeza tienen los resultados?","k":"certeza grado seguridad confianza margen error cuan confiables","a":"Moderada y limitada. Las cifras de UFC son claras para este grupo, pero la muestra es pequeña, no se identificaron especies y el análisis estadístico no mostró diferencia significativa. Conviene verlos como una asociación, no como una prueba definitiva."},{"q":"¿Qué significa «significativamente» en la conclusión?","k":"significativamente significativo significado palabra conclusion significa estadistica","a":"En la conclusión se usa para decir que la reducción de UFC con el jabón antibacterial fue marcada en este experimento. No es lo mismo que «estadísticamente significativo»: el chi-cuadrado del informe no encontró una diferencia significativa entre las frecuencias analizadas."},{"q":"¿Las bacterias eliminadas eran dañinas?","k":"bacterias eliminadas daninas patogenas buenas malas beneficiosas cuales eliminaron","a":"No se sabe. No se identificaron las especies, así que no se puede distinguir entre bacterias beneficiosas, neutras o dañinas. El informe indica que no se puede afirmar que el jabón elimine selectivamente patógenos."},{"q":"¿Se evaluó si la piel se dañó o se irritó?","k":"piel danada irritacion irritada resequedad salud piel efectos secundarios evaluo","a":"No. El proyecto no evaluó el estado de la piel, ni irritación ni resequedad. Solo se contaron y describieron las colonias."},{"q":"¿Puedo repetir este experimento en casa?","k":"repetir casa hacer en casa experimento cultivar placas bacterias seguridad","a":"No se recomienda cultivar microorganismos fuera de un laboratorio con supervisión, porque no se sabe qué crece en las placas. En el proyecto se trabajó en el laboratorio escolar, con guantes, mascarilla, mechero y la guía de una docente."},{"q":"¿Son peligrosas las placas con hongos o bacterias?","k":"placas peligrosas contagiar abrir tocar oler seguras hongos peligro","a":"Como no se identificaron los organismos, las placas deben tratarse con precaución: no se abren, no se huelen ni se tocan sin guantes, y se manejan solo en el laboratorio."},{"q":"¿Los resultados son iguales en todas las personas?","k":"iguales todas las personas individual diferencias personas distintas varian","a":"No. Las muestras mostraron mucha variación entre personas: en el grupo neutro hubo desde reducciones de casi 89% hasta aumentos de más de 100%. La piel y la exposición diaria de cada persona influyen."},{"q":"¿Por qué el informe habla de asociación y no de causa?","k":"asociacion causa causalidad por que prudente correlacion causa efecto informe","a":"Porque el diseño no controla todos los factores que influyen en la piel, como el ambiente, la manipulación diaria o las diferencias individuales. Por eso el informe habla de una asociación entre el tipo de jabón y los resultados, y no de una causa absoluta."},{"q":"¿El proyecto fue revisado por expertos?","k":"revisado expertos publicado cientifico revision pares validado arbitrado cientificos","a":"Es un proyecto escolar asesorado por una profesora. No ha sido publicado ni revisado por especialistas externos."},{"q":"¿Puedo usar esta información como consejo médico?","k":"consejo medico medico salud consejo diagnostico tratamiento tomar decisiones usar informacion","a":"No. Es un proyecto escolar con fines educativos. Para decisiones sobre tu salud o tu piel, consulta a un profesional."},{"q":"¿Qué jabón antibacterial se usó exactamente?","k":"que marca jabon usaron marca ingrediente activo exacto cual jabon triclosan contenia","a":"La información del proyecto no indica la marca ni el ingrediente activo exacto de los jabones usados; a los participantes no se les dijo la marca. Por eso no se puede asumir que contuviera triclosán."},{"q":"¿Los jabones actuales todavía llevan triclosán?","k":"jabones actuales triclosan todavia llevan contienen hoy productos etiqueta","a":"El proyecto no revisó qué productos actuales lo contienen. Para saberlo, revisa la lista de ingredientes en la etiqueta del producto."},{"q":"¿Se estudió si la microbiota se recupera o cuánto dura el efecto?","k":"efecto dura cuanto tiempo efecto duradero recuperacion largo plazo permanente","a":"No. Solo se midió antes y después de seis días de uso. No se evaluó si la microbiota se recupera ni cuánto dura el efecto."},{"q":"¿Qué no abarca este estudio?","k":"no abarca no incluye limites alcance que no se estudio fuera alcance excluye","a":"No estudió virus, hongos identificados, salud de la piel, resistencia bacteriana ni efectos a largo plazo. Tampoco identificó especies. Solo comparó UFC y morfotipos de colonias entre dos jabones durante seis días."},{"q":"¿Hay que dejar de lavarse las manos?","k":"dejar lavarse manos higiene lavar limpieza dejar de lavar","a":"No. El proyecto no plantea dejar de lavarse. Lo que muestra es que no hace falta eliminar todos los microorganismos de la piel, porque parte de ellos cumple una función protectora. Para consejos de higiene, consulta a un profesional de la salud."},{"q":"¿Qué debo tener en cuenta al interpretar estos resultados?","k":"interpretar interpretacion tener en cuenta cuidado precauciones resultados como leer","a":"Que son resultados de un estudio escolar pequeño, de seis días, con observación visual de colonias, sin identificar especies y sin diferencia estadísticamente significativa en el chi-cuadrado. Sirven para entender una tendencia, no para sacar conclusiones definitivas."}],"hero":4},"photos":[{"src":"data:image/webp;base64,UklGRjAeAABXRUJQVlA4ICQeAABQAwGdASo6AvgCPslkrlGnpa4vIhMYweAZCWdu2N/QxEBOMqe0Rp6ibBvFupab4/88HfT1PYSlp29O0/C/NTQ5m9CP+o/crP/z4CIZOiTyeKyTEmJMSYkxJiTEmJMSYk3u4fUI3s3EpoHuXxjgE1us1cCuUYTAfGJMSYnSnZDeK3gTHOqqb+7m6gg5woNb+SUEgoKgbnrzfZt1wINZeV/5tA5CPSXGynte/1i3xcRMQtqzrvAi2TPzvWBN7BWPy1GcJYYp8smKr5gCvdXis6lNjkDTEIhtM65t0G9QiBgiCYcA1wr+b58iOHmrl1K8QGUVQNu7gPJnAfm095xjbjQWCVd5tRNYo0ApoJs2OtlTFn   gb.append(gi,gbt);$('#preguntas').append(gb)}}catch(e){}})();

$('#qi').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});

/* Quiz */
let qi=0,sc=0;
function drawQ(){const z=$('#qz');if(qi>=C.quiz.length){z.innerHTML=`<h3>Tu puntaje: ${sc} de ${C.quiz.length}</h3><p class="muted" style="margin:8px 0 16px">${sc===C.quiz.length?'¡Perfecto! Ya conoces el proyecto.':'Revisa la galería y los resultados e inténtalo de nuevo.'}</p>`;const b=el('button','btn','Repetir quiz');b.onclick=()=>{qi=0;sc=0;drawQ()};z.append(b);return}
  const it=C.quiz[qi];z.innerHTML=`<div class="prog"><i style="width:${qi/C.quiz.length*100}%"></i></div><p class="muted small">Pregunta ${qi+1} de ${C.quiz.length}</p><h3 style="margin-top:4px">${it.q}</h3>`;
  it.o.forEach((o,i)=>{const b=el('button','opt',o);b.onclick=()=>{if(z.dataset.done==qi)return;z.dataset.done=qi;if(i===it.c)sc++;z.querySelectorAll('.opt').forEach((x,j)=>x.classList.add(j===it.c?'ok':'bad'));
    z.append(el('p','muted',it.e));const n=el('button','btn',qi===C.quiz.length-1?'Ver resultado':'Siguiente');n.style.marginTop='14px';n.onclick=()=>{qi++;drawQ()};z.append(n)};z.append(b)})}
drawQ();
set('#foot',C.foot);
/* Contador de visitas: solo lo ve la persona dueña de la página */
(async()=>{try{
 if(!window.claude)return;
 const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
 if(!db||!user)return;
 const owner=await user.isOwner(),id=await user.id();
 if(!owner&&id){try{const r=db.doc('visits/'+id);let n=1;try{const s=await r.get();if(s.exists)n=(s.data().n||0)+1}catch(e){}await r.set({n,last:Date.now()})}catch(e){}}
 if(owner){const p=el('div');p.id='vc';p.innerHTML='<button id="vb" aria-label="Ver visitas">👁 <span id="vn">–</span></button><div id="vd" hidden></div>';document.body.append(p);
  $('#vb').onclick=()=>{$('#vd').hidden=!$('#vd').hidden};
  db.collection('visits').onSnapshot(s=>{let tot=0,last=0;s.docs.forEach(d=>{const x=d.data();tot+=x.n||0;last=Math.max(last,x.last||0)});
   $('#vn').textContent=s.size;
   $('#vd').innerHTML=`<b>${s.size}</b> visitantes<br><b>${tot}</b> visitas en total<br>`+(last?`<span class="small">Última: ${new Date(last).toLocaleString('es')}</span><br>`:'')+'<span class="small muted">Solo cuenta a quienes abren la página con sesión de Claude. Solo tú ves este panel.</span>'},()=>{})}
}catch(e){}})();


/* Editor: solo la persona dueña (con permiso de edición) lo ve */
(async()=>{try{
 if(!window.claude)return;
 const [art,user]=await Promise.all([claude.use('artifact'),claude.use('user')]);
 if(!art||!user||!(await user.canEdit()))return;
 const TX=[['eyebrow','Etiqueta superior'],['title','Título'],['sub','Presentación','t'],['authors','Autores y colegio','t'],['fullTitle','Título completo del proyecto','t'],['question','Pregunta de investigación','t'],['resLead','Resumen de resultados','t'],['resNote','Nota en Resultados','t'],['foot','Pie de página']];
 const cp=x=>JSON.parse(JSON.stringify(x));
 let W,tab='Textos';
 const eb=el('button',0,'✏️ Editar');eb.id='eb';eb.dataset.ui='';document.body.append(eb);
 const ed=el('div');ed.id='ed';ed.dataset.ui='';document.body.append(ed);
 const fld=(lab,val,cb,area)=>{const w=el('div'),l=el('label');l.textContent=lab;const i=area?el('textarea'):el('input');if(!area)i.type='text';i.value=val||'';i.oninput=()=>cb(i.value);w.append(l,i);return w};
 const btn=(t,c,f)=>{const b=el('button','btn '+(c||''));b.textContent=t;b.onclick=f;return b};
 const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)});
 const st=el('span','small muted');
 function draw(){ed.innerHTML='';const h=el('div','eh');['Textos','Respuestas','Fotos'].forEach(n=>{const c=el('button','chip');c.textContent=n;c.setAttribute('aria-pressed',n===tab);c.onclick=()=>{tab=n;draw()};h.append(c)});
  const b=el('div','ebd');
  if(tab==='Textos'){TX.forEach(([k,l,a])=>b.append(fld(l,W.txt[k],v=>W.txt[k]=v,a)));
   b.append(el('h3',0,'Sección «Conoce el proyecto»'));b.lastChild.style.marginTop='24px';
   W.about.forEach((a,i)=>{const d=el('div','it');d.append(fld('Título',a[0],v=>a[0]=v),fld('Texto',a[1],v=>a[1]=v,1));b.append(d)})}
  if(tab==='Respuestas'){W.faq.forEach((f,i)=>{const d=el('div','it');d.append(fld('Pregunta',f.q,v=>f.q=v),fld('Respuesta',f.a,v=>f.a=v,1));const r=el('div','row');r.append(btn('Quitar','ghost',()=>{W.faq.splice(i,1);draw()}));d.append(r);b.append(d)});
   const r=el('div','row');r.append(btn('+ Agregar respuesta','ghost',()=>{W.faq.push({q:'',k:'',a:''});draw()}));b.append(r)}
  if(tab==='Fotos'){W.photos.forEach((p,i)=>{const d=el('div','it'),t=el('div','ph2'),im=el('img');im.src=p.src;const c=el('div');c.style.flex='1';c.append(fld('Descripción',p.cap,v=>p.cap=v),fld('Categoría',p.cat,v=>p.cat=v));t.append(im,c);d.append(t);
    const r=el('div','row');r.append(btn(W.hero===i?'✓ Portada':'Usar de portada','ghost',()=>{W.hero=i;draw()}),btn('Quitar','ghost',()=>{W.photos.splice(i,1);if(W.hero===i)W.hero=0;else if(W.hero>i)W.hero--;draw()}));d.append(r);b.append(d)});
   const f=el('input');f.type='file';f.accept='image/*';f.multiple=true;f.style.display='none';f.onchange=async()=>{st.textContent='Procesando fotos…';for(const x of f.files){try{W.photos.push({src:await rd(x),cat:'Placas de cultivo',cap:'Nueva foto'})}catch(e){}}st.textContent='';draw()};
   const r=el('div','row');r.append(btn('+ Agregar fotos','ghost',()=>f.click()),f);b.append(r)}
  const ft=el('div','ef');ft.append(st,btn('Cancelar','ghost',()=>{ed.classList.remove('on');document.body.style.overflow=''}),btn('Guardar y publicar','',save));ed.append(h,b,ft)}
 async function save(){st.textContent='Guardando…';
  try{const ov={...W.txt,about:W.about,faq:W.faq.filter(f=>f.q.trim()),hero:Math.min(W.hero,Math.max(W.photos.length-1,0))};
   const html='<!doctype html>\n<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Microbiota cutánea · Feria Científica</title><style id="css">'+document.getElementById('css').textContent+'</style></head><body><template id="skel">'+document.getElementById('skel').innerHTML+'</template><script id="state" type="application/json">'+JSON.stringify({ov,photos:W.photos}).replace(/</g,'\\u003c')+'<\/script><script id="app">'+document.getElementById('app').textContent+'<\/script></body></html>';
   await art.publish(html);st.textContent='Publicado ✓'}
  catch(e){st.textContent=e&&e.code==='conflict'?'Otra versión se publicó antes; recarga e inténtalo de nuevo.':'No se pudo guardar'+(e&&e.code?' ('+e.code+')':'')+(e&&e.message?': '+e.message:'')}}
 eb.onclick=()=>{W={txt:Object.fromEntries(TX.map(([k])=>[k,C[k]])),about:cp(C.about),faq:cp(C.faq),photos:cp(PHOTOS),hero:C.hero};tab='Textos';st.textContent='';draw();ed.classList.add('on');document.body.style.overflow='hidden'};
}catch(e){}})();
</script></body></html>
